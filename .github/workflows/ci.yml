name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # L'émulateur Firestore (e2e) est un process Java : firebase-tools 15 demande Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Lint build (vite build)
        run: npm run build

      - name: Unit tests (vitest)
        run: npm test
        env:
          # Les tests importent firebaseConfig : sans clé, getAuth() lève auth/invalid-api-key.
          # Valeurs factices, aucun appel réseau.
          VITE_FIREBASE_API_KEY: demo-api-key
          VITE_FIREBASE_AUTH_DOMAIN: demo-reviz.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: demo-reviz

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests (playwright)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
