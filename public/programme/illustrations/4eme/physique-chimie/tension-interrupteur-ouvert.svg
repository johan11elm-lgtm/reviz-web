<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 206" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- Pile de 4,5 V, interrupteur ouvert et lampe en série ; un voltmètre aux bornes de l’interrupteur ouvert affiche 4,5 V, un voltmètre aux bornes de la lampe éteinte affiche 0 V. Réviz, 4e physique-chimie, la tension électrique. -->
  <g fill="none" stroke="#2D2B57" stroke-width="1.75" stroke-linejoin="miter">
    <path d="M100,60 H250 V190 H100 Z"/>
  </g>
