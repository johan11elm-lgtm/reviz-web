  <g fill="#FFFFFF" stroke="#2D2B57" stroke-width="1.75"><circle cx="120" cy="248" r="7"/><circle cx="160" cy="248" r="7"/><circle cx="200" cy="248" r="7"/><circle cx="240" cy="248" r="7"/></g>
