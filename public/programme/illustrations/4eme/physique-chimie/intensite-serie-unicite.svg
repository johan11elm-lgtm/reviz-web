  <g><circle cx="270" cy="142" r="10" fill="#FFFFFF" stroke="#2D2B57" stroke-width="1.75"/><path d="M262.9,134.9 L277.1,149.1 M262.9,149.1 L277.1,134.9" stroke="#2D2B57" stroke-width="1.75"/></g>
