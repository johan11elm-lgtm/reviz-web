  <g><circle cx="140" cy="50" r="11" fill="#FBE9DD" stroke="#B34400" stroke-width="2.25"/><text x="140" y="54.4" font-size="12.5" font-weight="700" fill="#2D2B57" text-anchor="middle">A</text></g>
  <g><circle cx="270" cy="88" r="11" fill="#FBE9DD" stroke="#B34400" stroke-width="2.25"/><text x="270" y="92.4" font-size="12.5" font-weight="700" fill="#2D2B57" text-anchor="middle">A</text></g>
  <g><circle cx="180" cy="180" r="11" fill="#FBE9DD" stroke="#B34400" stroke-width="2.25"/><text x="180" y="184.4" font-size="12.5" font-weight="700" fill="#2D2B57" text-anchor="middle">A</text></g>
