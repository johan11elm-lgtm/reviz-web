<rect x="14" y="205" width="26" height="14" fill="#AFC3F0" stroke="#2D2B57" stroke-width="0.75"/><text x="50" y="216">Eaux territoriales</text><g class="ill-legende"><rect class="ill-fond" x="47" y="220" width="247" height="15" rx="4" fill="#FFFFFF"/><text font-size="11" fill="#8A8273" x="50" y="231">l'État est souverain, comme sur sa terre</text></g>
