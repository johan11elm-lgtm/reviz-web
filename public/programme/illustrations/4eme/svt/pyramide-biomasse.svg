<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 160" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- Pyramide de biomasse : 1 000 kg d'herbe, 100 kg de lapins, 10 kg de renards (largeurs non proportionnelles). Réviz, 4e SVT, relations alimentaires. -->
<rect x="26" y="108" width="280" height="40" rx="4" fill="#DDF2E3" stroke="#2E8B57" stroke-width="1.75"/><text x="166" y="125" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2D2B57">Herbe</text><rect x="82" y="64" width="168" height="40" rx="4" fill="#F4EBDD" stroke="#2D2B57" stroke-width="1.75"/><text x="166" y="81" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2D2B57">Lapins</text><rect x="124" y="20" width="84" height="40" rx="4" fill="#F4EBDD" stroke="#2D2B57" stroke-width="1.75"/><text x="166" y="37" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2D2B57">Renards</text><path d="M322,128 L322,92.8" stroke="#8A8273" stroke-width="1.5" fill="none"/><path d="M322,88 L325.3,94 L318.7,94 Z" fill="#8A8273"/><text x="329" y="110" font-size="11" font-weight="600" fill="#8A8273">÷ 10</text><path d="M322,84 L322,48.8" stroke="#8A8273" stroke-width="1.5" fill="none"/><path d="M322,44 L325.3,50 L318.7,50 Z" fill="#8A8273"/><text x="329" y="66" font-size="11" font-weight="600" fill="#8A8273">÷ 10</text><g font-size="11.5" font-weight="600" fill="#2D2B57"><g class="ill-legende"><rect class="ill-fond" x="137.3" y="128" width="57.4" height="15" rx="4" fill="#DDF2E3"/><text x="166" y="139" text-anchor="middle">1 000 kg</text></g><g class="ill-legende"><rect class="ill-fond" x="143.6" y="84" width="44.8" height="15" rx="4" fill="#F4EBDD"/><text x="166" y="95" text-anchor="middle">100 kg</text></g><g class="ill-legende"><rect class="ill-fond" x="146.8" y="40" width="38.5" height="15" rx="4" fill="#F4EBDD"/><text x="166" y="51" text-anchor="middle">10 kg</text></g></g>
</svg>
