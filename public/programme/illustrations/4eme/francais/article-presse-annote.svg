<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<!-- Maquette d'une page d'article de presse (article inventé, texte remplacé par des traits) avec ses parties légendées : nom du journal, date, titre, chapeau, photo, légende, attaque, corps de l'article, intertitre, signature. Réviz, 4e français, Informer, s'informer, déformer ? -->
<!-- Page -->
<rect x="104" y="12" width="152" height="306" rx="2" fill="#FFFFFF" stroke="#2D2B57" stroke-width="1.75"/>
<!-- Bandeau : nom du journal et date -->
<rect x="112" y="21" width="84" height="10" rx="1" fill="#2D2B57"/>
<rect x="216" y="24" width="32" height="5" rx="1" fill="#8A8273"/>
<path d="M112,38H248" stroke="#2D2B57" stroke-width="1"/>
<!-- Chapeau (gras) -->
<g fill="#2D2B57"><rect x="112" y="82" width="136" height="4.5" rx="1"/><rect x="112" y="90" width="136" height="4.5" rx="1"/><rect x="112" y="98" width="88" height="4.5" rx="1"/></g>
<!-- Photo -->
<rect x="112" y="110" width="136" height="68" fill="#EAE8F2" stroke="#2D2B57" stroke-width="1"/>
<path d="M118,172L148,138L166,156L182,142L242,172Z" fill="#FFFFFF" stroke="#2D2B57" stroke-width="1" stroke-linejoin="round"/>
<circle cx="222" cy="128" r="7" fill="#FFFFFF" stroke="#2D2B57" stroke-width="1"/>
<!-- Légende de la photo -->
<g fill="#8A8273"><rect x="112" y="184" width="120" height="2.5"/><rect x="112" y="190" width="72" height="2.5"/></g>
<!-- Attaque (premier paragraphe, en accent) -->
<g fill="#B34400"><rect x="112" y="204" width="136" height="3"/><rect x="112" y="211" width="136" height="3"/><rect x="112" y="218" width="104" height="3"/></g>
<!-- Corps de l'article -->
<g fill="#B8B2A6"><rect x="112" y="229" width="136" height="3"/><rect x="112" y="236" width="136" height="3"/><rect x="112" y="243" width="120" height="3"/>
<rect x="112" y="268" width="136" height="3"/><rect x="112" y="275" width="136" height="3"/><rect x="112" y="282" width="136" height="3"/><rect x="112" y="289" width="136" height="3"/><rect x="112" y="296" width="90" height="3"/></g>
<!-- Intertitre -->
<rect x="112" y="255" width="72" height="5" rx="1" fill="#2D2B57"/>
<!-- Signature -->
<rect x="204" y="306" width="44" height="4" rx="1" fill="#2D2B57"/>
<!-- Titre (texte) -->
<g font-size="12.5" font-weight="700" fill="#2D2B57">
<text x="112" y="57">Un incendie détruit</text>
<text x="112" y="72">un entrepôt à Lyon</text>
</g>
<!-- Traits de rappel -->
<g stroke="#2D2B57" stroke-width="1" opacity="0.6">
<path d="M95,29H112"/><path d="M95,63H110"/><path d="M95,92H112"/><path d="M95,212H112"/><path d="M95,279H112"/>
<path d="M265,27H248"/><path d="M265,143H240"/><path d="M265,189H232"/><path d="M265,257H184"/><path d="M265,308H248"/>
</g>
<g fill="#2D2B57">
<circle cx="112" cy="29" r="1.8"/><circle cx="110" cy="63" r="1.8"/><circle cx="112" cy="92" r="1.8"/><circle cx="112" cy="212" r="1.8"/><circle cx="112" cy="279" r="1.8"/>
<circle cx="248" cy="27" r="1.8"/><circle cx="240" cy="143" r="1.8"/><circle cx="232" cy="189" r="1.8"/><circle cx="184" cy="257" r="1.8"/><circle cx="248" cy="308" r="1.8"/>
</g>
<g font-size="11.5" font-weight="600" fill="#2D2B57">
<g class="ill-legende"><rect class="ill-fond" x="34" y="15" width="61" height="28" rx="4" fill="#FFFFFF"/><text x="92" y="26" text-anchor="end">Nom du<tspan x="92" dy="13">journal</tspan></text></g>
<g class="ill-legende"><rect class="ill-fond" x="57" y="56" width="38" height="15" rx="4" fill="#FFFFFF"/><text x="92" y="67" text-anchor="end">Titre</text></g>
<g class="ill-legende"><rect class="ill-fond" x="38" y="85" width="57" height="15" rx="4" fill="#FFFFFF"/><text x="92" y="96" text-anchor="end">Chapeau</text></g>
<g class="ill-legende"><rect class="ill-fond" x="41" y="205" width="54" height="15" rx="4" fill="#FFFFFF"/><text x="92" y="216" text-anchor="end">Attaque</text></g>
<g class="ill-legende"><rect class="ill-fond" x="31" y="265" width="64" height="28" rx="4" fill="#FFFFFF"/><text x="92" y="276" text-anchor="end">Corps de<tspan x="92" dy="13">l'article</tspan></text></g>
<g class="ill-legende"><rect class="ill-fond" x="265" y="20" width="38" height="15" rx="4" fill="#FFFFFF"/><text x="268" y="31">Date</text></g>
<g class="ill-legende"><rect class="ill-fond" x="265" y="136" width="45" height="15" rx="4" fill="#FFFFFF"/><text x="268" y="147">Photo</text></g>
<g class="ill-legende"><rect class="ill-fond" x="265" y="182" width="58" height="15" rx="4" fill="#FFFFFF"/><text x="268" y="193">Légende</text></g>
<g class="ill-legende"><rect class="ill-fond" x="265" y="250" width="70" height="15" rx="4" fill="#FFFFFF"/><text x="268" y="261">Intertitre</text></g>
<g class="ill-legende"><rect class="ill-fond" x="265" y="301" width="70" height="15" rx="4" fill="#FFFFFF"/><text x="268" y="312">Signature</text></g>
</g>
</svg>
