<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<!-- Plan de quartier fictif pour situer les lieux : bank between the café and the bookshop, opposite the park ; church behind the bank ; museum on the corner ; carrefour, feux, passage piéton, pont ; itinéraire depuis « You are here » (cross the bridge, go straight on until the traffic lights, then turn left). Réviz, 4e anglais, se repérer en ville. -->
<rect x="12" y="12" width="336" height="296" fill="#FFFFFF" stroke="#C9C4B8" stroke-width="0.75"/>
<!-- Rivière et pont -->
<rect x="12" y="246" width="336" height="24" fill="#DCE6FA"/>
<path d="M12,246H348M12,270H348" stroke="#3461C9" stroke-width="1"/>
<rect x="234" y="242" width="30" height="32" fill="#FFFFFF"/>
<path d="M234,240V276M264,240V276" stroke="#2D2B57" stroke-width="1.75"/>
<!-- Îlots -->
<g fill="#F1EEE8" stroke="#CFC8BA" stroke-width="1">
<rect x="14" y="14" width="218" height="114" rx="3"/>
<rect x="266" y="14" width="80" height="114" rx="3"/>
<rect x="14" y="162" width="218" height="80" rx="3"/>
<rect x="266" y="162" width="80" height="80" rx="3"/>
<rect x="14" y="274" width="218" height="32" rx="3"/>
<rect x="266" y="274" width="80" height="32" rx="3"/>
</g>
<!-- Parc -->
<rect x="36" y="166" width="140" height="72" rx="3" fill="#DDF2E3" stroke="#2E8B57" stroke-width="1"/>
<g fill="#2E8B57" opacity="0.55"><circle cx="52" cy="182" r="6.5"/><circle cx="160" cy="182" r="6.5"/><circle cx="52" cy="222" r="6.5"/><circle cx="160" cy="222" r="6.5"/></g>
<!-- Bâtiments -->
<g fill="#FFFFFF" stroke="#2D2B57" stroke-width="1.75">
<rect x="18" y="88" width="52" height="36" rx="2"/>
<rect x="76" y="88" width="66" height="36" rx="2"/>
<rect x="148" y="88" width="80" height="36" rx="2"/>
<rect x="76" y="20" width="66" height="52" rx="2"/>
<rect x="284" y="80" width="58" height="44" rx="2"/>
<rect x="140" y="278" width="88" height="26" rx="2"/>
</g>
<path d="M131,26v12M126,30h10" stroke="#2D2B57" stroke-width="1.75"/>
<!-- Passage piéton (sur la rue verticale, au nord du carrefour) -->
<path d="M239.5,101v18M244.5,101v18M249.5,101v18M254.5,101v18M259.5,101v18" stroke="#2D2B57" stroke-width="2.6"/>
<!-- Feux tricolores (deux angles du carrefour) -->
<g fill="#2D2B57"><rect x="266.5" y="111" width="7" height="16" rx="2"/><rect x="225.5" y="163" width="7" height="16" rx="2"/></g>
<g fill="#FFFFFF"><circle cx="270" cy="115" r="1.6"/><circle cx="270" cy="119" r="1.6"/><circle cx="270" cy="123" r="1.6"/><circle cx="229" cy="167" r="1.6"/><circle cx="229" cy="171" r="1.6"/><circle cx="229" cy="175" r="1.6"/></g>
<!-- Mentions secondaires -->
<g font-size="11" font-weight="600" fill="#8A8273">
<text x="22" y="262">river</text>
</g>
<!-- Itinéraire -->
<path d="M249,284V140H118" fill="none" stroke="#B34400" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M110,140L118,135.5L118,144.5Z" fill="#B34400"/>
<circle cx="249" cy="290" r="5" fill="#B34400" stroke="#FFFFFF" stroke-width="1.5"/>
<!-- Traits de rappel -->
<g stroke="#2D2B57" stroke-width="1" opacity="0.6">
<path d="M196,72L238,106"/>
<path d="M282,56L270.5,111"/>
<path d="M276,190L253,152"/>
<path d="M271,226L262,258"/>
</g>
<g fill="#2D2B57"><circle cx="238" cy="106" r="1.8"/><circle cx="270.5" cy="111" r="1.8"/><circle cx="253" cy="152" r="1.8"/><circle cx="262" cy="258" r="1.8"/></g>
<g font-size="11.5" font-weight="600" fill="#2D2B57">
<text x="258" y="300">You are here</text>
<g class="ill-legende"><rect class="ill-fond" x="22" y="97" width="44" height="18" rx="4" fill="#FFFFFF"/><text x="44" y="110" text-anchor="middle">café</text></g>
<g class="ill-legende"><rect class="ill-fond" x="88" y="97" width="42" height="18" rx="4" fill="#FFFFFF"/><text x="109" y="110" text-anchor="middle">bank</text></g>
<g class="ill-legende"><rect class="ill-fond" x="155" y="97" width="66" height="18" rx="4" fill="#FFFFFF"/><text x="188" y="110" text-anchor="middle">bookshop</text></g>
<g class="ill-legende"><rect class="ill-fond" x="82" y="44" width="54" height="18" rx="4" fill="#FFFFFF"/><text x="109" y="57" text-anchor="middle">church</text></g>
<g class="ill-legende"><rect class="ill-fond" x="287" y="93" width="52" height="18" rx="4" fill="#FFFFFF"/><text x="313" y="106" text-anchor="middle">museum</text></g>
<g class="ill-legende"><rect class="ill-fond" x="84" y="193" width="44" height="18" rx="4" fill="#DDF2E3"/><text x="106" y="206" text-anchor="middle">park</text></g>
<g class="ill-legende"><rect class="ill-fond" x="156" y="282" width="56" height="18" rx="4" fill="#FFFFFF"/><text x="184" y="295" text-anchor="middle">station</text></g>
<g class="ill-legende"><rect class="ill-fond" x="151" y="31" width="72" height="41" rx="4" fill="#F1EEE8"/><text x="155" y="44">pedestrian<tspan x="155" dy="13">crossing</tspan></text></g>
<g class="ill-legende"><rect class="ill-fond" x="278" y="27" width="56" height="29" rx="4" fill="#F1EEE8"/><text x="282" y="39">traffic<tspan x="282" dy="13">lights</tspan></text></g>
<g class="ill-legende"><rect class="ill-fond" x="270" y="179" width="72" height="18" rx="4" fill="#F1EEE8"/><text x="274" y="192">crossroads</text></g>
<g class="ill-legende"><rect class="ill-fond" x="270" y="211" width="50" height="18" rx="4" fill="#F1EEE8"/><text x="274" y="224">bridge</text></g>
</g>
</svg>
