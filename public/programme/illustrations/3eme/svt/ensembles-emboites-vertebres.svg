<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 264" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- Ensembles emboîtés : vertébrés, tétrapodes, mammifères, primates, avec truite, grenouille, chat, chimpanzé et Homme. Réviz, 3e SVT, parenté et classification. -->
<rect x="12" y="12" width="336" height="240" rx="10" fill="#F6F5FA" stroke="#2D2B57" stroke-width="1.75"/><text x="21" y="44" font-size="11" font-weight="600" fill="#8A8273">colonne vertébrale</text><rect x="86" y="54" width="254" height="190" rx="10" fill="#ECEAF4" stroke="#2D2B57" stroke-width="1.75"/><text x="95" y="86" font-size="11" font-weight="600" fill="#8A8273">quatre membres</text><rect x="162" y="96" width="170" height="140" rx="10" fill="#E2DFEE" stroke="#2D2B57" stroke-width="1.75"/><text x="171" y="128" font-size="11" font-weight="600" fill="#8A8273">poils et mamelles</text><rect x="220" y="138" width="104" height="90" rx="10" fill="#FBE9DD" stroke="#B34400" stroke-width="2.25"/><text x="229" y="170" font-size="11" font-weight="600" fill="#8A8273">pouce opposable</text><g font-size="11.5" font-weight="600" fill="#2D2B57" text-anchor="middle"><text x="49" y="214">Truite</text><text x="124" y="214">Grenouille</text><text x="191" y="214">Chat</text><text x="272" y="196">Chimpanzé</text><text x="272" y="214">Homme</text></g><g font-size="11.5" font-weight="600" fill="#2D2B57"><g class="ill-legende"><rect class="ill-fond" x="18" y="19" width="63.7" height="15" rx="4" fill="#F6F5FA"/><text x="21" y="30">Vertébrés</text></g><g class="ill-legende"><rect class="ill-fond" x="92" y="61" width="70" height="15" rx="4" fill="#ECEAF4"/><text x="95" y="72">Tétrapodes</text></g><g class="ill-legende"><rect class="ill-fond" x="168" y="103" width="70" height="15" rx="4" fill="#E2DFEE"/><text x="171" y="114">Mammifères</text></g><g class="ill-legende"><rect class="ill-fond" x="226" y="145" width="57.4" height="15" rx="4" fill="#FBE9DD"/><text x="229" y="156">Primates</text></g></g>
