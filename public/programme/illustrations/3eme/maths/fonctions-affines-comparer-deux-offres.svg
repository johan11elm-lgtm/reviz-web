<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 268" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- Comparaison de deux offres pour 0 à 10 séances : offre A f(x) = 2x + 15 et offre B g(x) = 5x ; les droites se coupent au point (5 ; 25). Réviz, 3e maths, fonctions linéaires et affines. -->
  <!-- Quadrillage -->
  <g stroke="#EAE8F2" stroke-width="1">
    <path d="M40,236 V20"/>
    <path d="M66,236 V20"/>
    <path d="M92,236 V20"/>
    <path d="M118,236 V20"/>
    <path d="M144,236 V20"/>
    <path d="M170,236 V20"/>
    <path d="M196,236 V20"/>
    <path d="M222,236 V20"/>
    <path d="M248,236 V20"/>
    <path d="M274,236 V20"/>
    <path d="M300,236 V20"/>
    <path d="M40,236 H310.4"/>
    <path d="M40,216 H310.4"/>
    <path d="M40,196 H310.4"/>
    <path d="M40,176 H310.4"/>
    <path d="M40,156 H310.4"/>
    <path d="M40,136 H310.4"/>
    <path d="M40,116 H310.4"/>
    <path d="M40,96 H310.4"/>
    <path d="M40,76 H310.4"/>
