    <path d="M40,236 V14"/>
    <path d="M66,233 V239 M92,233 V239 M118,233 V239 M144,233 V239 M170,233 V239 M196,233 V239 M222,233 V239 M248,233 V239 M274,233 V239 M300,233 V239 M37,196 H43 M37,156 H43 M37,116 H43 M37,76 H43 M37,36 H43"/>
  </g>
  <path d="M320.4,236 L313.4,239.2 L313.4,232.9 Z" fill="#2D2B57"/>
  <path d="M40,10 L43.2,17 L36.9,17 Z" fill="#2D2B57"/>

  <!-- Offre A : f(x) = 2x + 15 ; offre B : g(x) = 5x ; elles se coupent en (5 ; 25) -->
  <g stroke="#2D2B57" stroke-width="1.75" stroke-linecap="round">
    <path d="M40,176 L300,96" />
    <path d="M40,236 L300,36" />
  </g>
  <path d="M170,236 V136 H40" fill="none" stroke="#B34400" stroke-width="1.75" stroke-dasharray="4 3"/>
  <circle cx="170" cy="136" r="3.4" fill="#B34400"/>
  <g fill="#2D2B57"><circle cx="40" cy="176" r="2.2" fill="#2D2B57"/></g>
  <!-- Graduations -->
  <g font-size="10.5" fill="#2D2B57" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" paint-order="stroke">
    <text x="66" y="249" text-anchor="middle">1</text>
    <text x="92" y="249" text-anchor="middle">2</text>
    <text x="118" y="249" text-anchor="middle">3</text>
    <text x="144" y="249" text-anchor="middle">4</text>
    <text x="170" y="249" text-anchor="middle">5</text>
    <text x="196" y="249" text-anchor="middle">6</text>
    <text x="222" y="249" text-anchor="middle">7</text>
    <text x="248" y="249" text-anchor="middle">8</text>
    <text x="274" y="249" text-anchor="middle">9</text>
    <text x="300" y="249" text-anchor="middle">10</text>
    <text x="35" y="199.5" text-anchor="end">10</text>
    <text x="35" y="159.5" text-anchor="end">20</text>
    <text x="35" y="119.5" text-anchor="end">30</text>
    <text x="35" y="79.5" text-anchor="end">40</text>
    <text x="35" y="39.5" text-anchor="end">50</text>
    <text x="35" y="249" text-anchor="end">0</text>
  </g>
  <g font-size="11" font-weight="700" font-style="italic" fill="#2D2B57">
    <text x="316.4" y="229" text-anchor="end"></text>
    <text x="47" y="16"></text>
  </g>

  <g font-size="12" font-weight="700" fill="#2D2B57" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">
    <text x="264" y="38" text-anchor="end">Offre B<tspan x="264" dy="14" font-weight="600">g(x) = 5x</tspan></text>
    <text x="300" y="140" text-anchor="end">Offre A<tspan x="300" dy="14" font-weight="600">f(x) = 2x + 15</tspan></text>
  </g>
  <g font-size="11" font-weight="600" fill="#8A8273">
