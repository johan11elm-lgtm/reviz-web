  <path d="M128.6,72.5L207.4,95.5" fill="none" stroke="#2D2B57" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  <g class="ill-legende"><rect class="ill-fond" x="152.8" y="90.6" width="24.9" height="15" rx="4" fill="#FFFFFF"/><text x="165.2" y="101.6" font-size="11.5" font-weight="600" fill="#2D2B57" text-anchor="middle">1/2</text></g>
  <path d="M128.6,175.5L207.4,152.5" fill="none" stroke="#2D2B57" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
