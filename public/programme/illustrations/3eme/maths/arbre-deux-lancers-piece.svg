  <text x="354" y="16" font-size="11" font-weight="600" fill="#8A8273" text-anchor="end">probabilité</text>
  <text x="180" y="244" font-size="13" font-weight="600" fill="#2D2B57" text-anchor="middle">P(pile puis pile) = 1/2 × 1/2 = 1/4</text>
