<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- Réciproque de Thalès : AM/AB = AN/AC = 0,6 dans les deux cas ; à gauche, points alignés dans le même ordre et (MN) // (BC) ; à droite, N de l'autre côté de A et (MN) non parallèle à (BC). Réviz, 3e maths, théorème de Thalès. -->
