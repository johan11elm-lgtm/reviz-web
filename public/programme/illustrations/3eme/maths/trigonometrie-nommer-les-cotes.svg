<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 190" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- Triangle ABC rectangle en A : hypoténuse [BC] ; pour l'angle en B, côté adjacent [AB] et côté opposé [AC] ; pour l'angle en C, ils s'échangent. Réviz, 3e maths, trigonométrie. -->
  <path d="M176,28 V180" stroke="#EDE8E1" stroke-width="1"/>
  <path d="M154,148 L130,148 A24 24 0 0 1 136.1,132 Z" fill="#FBE9DD"/>
  <path d="M130,148 A24 24 0 0 1 136.1,132" fill="none" stroke="#B34400" stroke-width="2.25"/>
  <path d="M68,148 L68,138 L58,138" fill="none" stroke="#2D2B57" stroke-width="1.3"/>
  <g fill="none" stroke="#2D2B57" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M58,148 L154,148 L58,62 Z" />
  </g>
  <g fill="#2D2B57"><circle cx="58" cy="148" r="2.2" fill="#2D2B57"/><circle cx="154" cy="148" r="2.2" fill="#2D2B57"/><circle cx="58" cy="62" r="2.2" fill="#2D2B57"/></g>
  <g font-size="12.5" font-weight="700" fill="#2D2B57" text-anchor="middle"><text x="50" y="162">A</text><text x="163" y="162">B</text><text x="58" y="54">C</text></g>
  <text x="90" y="18" font-size="11" font-weight="600" fill="#8A8273" text-anchor="middle">Angle en B</text>
  <path d="M244,62 L244,86 A24 24 0 0 0 261.9,78 Z" fill="#FBE9DD"/>
  <path d="M244,86 A24 24 0 0 0 261.9,78" fill="none" stroke="#B34400" stroke-width="2.25"/>
  <path d="M254,148 L254,138 L244,138" fill="none" stroke="#2D2B57" stroke-width="1.3"/>
  <g fill="none" stroke="#2D2B57" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M244,148 L340,148 L244,62 Z" />
  </g>
  <g fill="#2D2B57"><circle cx="244" cy="148" r="2.2" fill="#2D2B57"/><circle cx="340" cy="148" r="2.2" fill="#2D2B57"/><circle cx="244" cy="62" r="2.2" fill="#2D2B57"/></g>
  <g font-size="12.5" font-weight="700" fill="#2D2B57" text-anchor="middle"><text x="236" y="162">A</text><text x="349" y="162">B</text><text x="244" y="54">C</text></g>
  <text x="276" y="18" font-size="11" font-weight="600" fill="#8A8273" text-anchor="middle">Angle en C</text>
  <g font-size="11.5" font-weight="600" fill="#2D2B57">
    <g class="ill-legende" text-anchor="middle">
      <rect class="ill-fond" x="62.1" y="163" width="87.9" height="15" rx="4" fill="#FFFFFF"/>
      <text x="106" y="174">Côté adjacent</text>
    </g>
    <g class="ill-legende" text-anchor="end">
      <rect class="ill-fond" x="8.2" y="91" width="43.8" height="28" rx="4" fill="#FFFFFF"/>
      <text x="49" y="102">Côté<tspan x="49" dy="13">opposé</tspan></text>
    </g>
    <g class="ill-legende">
      <rect class="ill-fond" x="99" y="79" width="69" height="15" rx="4" fill="#FFFFFF"/>
      <text x="102" y="90">Hypoténuse</text>
    </g>
    <g class="ill-legende" text-anchor="middle">
      <rect class="ill-fond" x="254.4" y="163" width="75.3" height="15" rx="4" fill="#FFFFFF"/>
      <text x="292" y="174">Côté opposé</text>
    </g>
    <g class="ill-legende" text-anchor="end">
      <rect class="ill-fond" x="181.6" y="91" width="56.4" height="28" rx="4" fill="#FFFFFF"/>
      <text x="235" y="102">Côté<tspan x="235" dy="13">adjacent</tspan></text>
    </g>
    <g class="ill-legende">
      <rect class="ill-fond" x="285" y="79" width="69" height="15" rx="4" fill="#FFFFFF"/>
      <text x="288" y="90">Hypoténuse</text>
    </g>
  </g>
</svg>
