    <circle cx="200" cy="287" r="1.8"/>
    <circle cx="99" cy="192" r="1.8"/>
    <circle cx="200" cy="250" r="1.8"/>
    <circle cx="300" cy="250" r="1.8"/>
  </g>
  <g font-size="11.5" font-weight="600" fill="#2D2B57">
    <g class="ill-legende" text-anchor="middle">
      <rect class="ill-fond" x="184.4" y="136" width="31.2" height="15" rx="4" fill="#FFFFFF"/>
