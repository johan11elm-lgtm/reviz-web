<svg xmlns="http://www.w3.org/2000/svg" viewBox="-9 -9 378 358" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- Double circulation : poumons en haut, cœur au milieu (cœur droit à gauche du dessin), organes en bas. Réviz, 5e SVT, circulation sanguine. -->

  <!-- Poumons et organes : réseaux de capillaires -->
  <g fill="#FFFFFF" stroke="#2D2B57" stroke-width="1.75">
    <rect x="96" y="14" width="180" height="46" rx="10"/>
    <rect x="96" y="290" width="180" height="40" rx="10"/>
  </g>
  <g fill="none" stroke-width="2.2" stroke-linecap="round">
    <g stroke="#3461C9">
      <path d="M116,60 V26"/>
      <path d="M116,26 q9,-5 18,0 t18,0 t18,0 t18,0 M116,38 q9,-5 18,0 t18,0 t18,0 t18,0 M116,50 q9,-5 18,0 t18,0 t18,0 t18,0"/>
      <path d="M104,290 V320"/>
      <path d="M104,300 q9,5 18,0 t18,0 t18,0 t18,0 M104,310 q9,5 18,0 t18,0 t18,0 t18,0 M104,320 q9,5 18,0 t18,0 t18,0 t18,0"/>
    </g>
    <g stroke="#C8364F">
      <path d="M262,26 V60"/>
      <path d="M188,26 q9,-5 18.5,0 t18.5,0 t18.5,0 t18.5,0 M188,38 q9,-5 18.5,0 t18.5,0 t18.5,0 t18.5,0 M188,50 q9,-5 18.5,0 t18.5,0 t18.5,0 t18.5,0"/>
      <path d="M264,290 V320"/>
      <path d="M176,300 q11,5 22,0 t22,0 t22,0 t22,0 M176,310 q11,5 22,0 t22,0 t22,0 t22,0 M176,320 q11,5 22,0 t22,0 t22,0 t22,0"/>
    </g>
  </g>

  <!-- Muscle cardiaque -->
  <rect x="118" y="128" width="126" height="108" rx="16" fill="#FFFFFF" stroke="#2D2B57" stroke-width="2"/>

  <!-- Vaisseaux : contour encre puis couleur du sang -->
  <g fill="none" stroke-linejoin="round">
    <g stroke="#2D2B57" stroke-width="12">
      <path d="M168,184 V98 H116 V60"/>
      <path d="M262,60 V148 H232"/>
      <path d="M104,290 V164 H130"/>
      <path d="M232,214 H264 V290"/>
    </g>
    <g stroke-width="8">
      <path d="M168,184 V98 H116 V60" stroke="#3461C9"/>
      <path d="M262,60 V148 H232" stroke="#C8364F"/>
      <path d="M104,290 V164 H130" stroke="#3461C9"/>
      <path d="M232,214 H264 V290" stroke="#C8364F"/>
    </g>
  </g>

  <!-- Les quatre cavités -->
  <g stroke-width="2.2">
    <rect x="126" y="136" width="32" height="38" rx="9" fill="#DCE6FA" stroke="#3461C9"/>
    <rect x="126" y="182" width="50" height="46" rx="10" fill="#DCE6FA" stroke="#3461C9"/>
    <rect x="188" y="136" width="48" height="38" rx="9" fill="#F9DCE1" stroke="#C8364F"/>
    <rect x="184" y="182" width="52" height="46" rx="10" fill="#F9DCE1" stroke="#C8364F"/>
  </g>

  <!-- Valvules -->
  <path d="M134,175 L141,182 M150,175 L143,182 M198,175 L205,182 M214,175 L207,182" fill="none" stroke="#2D2B57" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Trajet du sang dans le cœur -->
  <g fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M142,144 V204 Q142,219 155,219 Q166,219 166,200 M161,205 L166,199 L171,205" stroke="#1F3F8F"/>
    <path d="M206,144 V202 Q206,214 218,214 H227 M222,209 L228,214 L222,219" stroke="#8E1F33"/>
  </g>

  <!-- Sens du sang dans les vaisseaux -->
  <path d="M163,116 L168,111 L173,116 M143,93 L138,98 L143,103 M257,98 L262,103 L267,98 M99,242 L104,237 L109,242 M111,159 L116,164 L111,169 M246,209 L251,214 L246,219 M259,258 L264,263 L269,258" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Côtés, par rapport à la personne -->
  <g font-size="11" font-weight="600" fill="#8A8273">
    <text x="6" y="187">Cœur droit</text>
    <text x="354" y="201" text-anchor="end">Cœur gauche</text>
  </g>

  <!-- Traits de rappel -->
  <g stroke="#2D2B57" stroke-width="1" opacity="0.6" fill="none">
    <path d="M59,30 L100,32"/>
    <path d="M75,80 L111,80"/>
    <path d="M69,143 L135,147"/>
    <path d="M53,214 L99,214"/>
    <path d="M59,304 L99,306"/>
    <path d="M279,92 L267,92"/>
    <path d="M287,165 L226,163"/>
    <path d="M280,243 L269,243"/>
    <path d="M285,304 L240,310"/>
    <path d="M132,242 L140,222"/>
    <path d="M236,242 L222,222"/>
  </g>
  <g fill="#2D2B57">
    <circle cx="100" cy="32" r="1.8"/>
    <circle cx="111" cy="80" r="1.8"/>
    <circle cx="135" cy="147" r="1.8"/>
    <circle cx="99" cy="214" r="1.8"/>
    <circle cx="99" cy="306" r="1.8"/>
    <circle cx="267" cy="92" r="1.8"/>
    <circle cx="226" cy="163" r="1.8"/>
    <circle cx="269" cy="243" r="1.8"/>
    <circle cx="240" cy="310" r="1.8"/>
    <circle cx="140" cy="222" r="1.8"/>
    <circle cx="222" cy="222" r="1.8"/>
  </g>

  <!-- Légendes : un groupe par étiquette (masquables en mode « Me tester ») -->
  <g font-size="11.5" font-weight="600" fill="#2D2B57">
    <g class="ill-legende">
      <rect class="ill-fond" x="3" y="22" width="56" height="15" rx="4" fill="#FFFFFF"/>
      <text x="6" y="33">Poumons</text>
    </g>
    <g class="ill-legende">
      <rect class="ill-fond" x="3" y="66" width="72" height="28" rx="4" fill="#FFFFFF"/>
      <text x="6" y="77">Artère<tspan x="6" dy="13">pulmonaire</tspan></text>
    </g>
    <g class="ill-legende">
      <rect class="ill-fond" x="3" y="130" width="66" height="28" rx="4" fill="#FFFFFF"/>
      <text x="6" y="141">Oreillette<tspan x="6" dy="13">droite</tspan></text>
    </g>
    <g class="ill-legende">
      <rect class="ill-fond" x="3" y="200" width="50" height="28" rx="4" fill="#FFFFFF"/>
      <text x="6" y="211">Veines<tspan x="6" dy="13">caves</tspan></text>
    </g>
    <g class="ill-legende">
      <rect class="ill-fond" x="3" y="297" width="56" height="15" rx="4" fill="#FFFFFF"/>
      <text x="6" y="308">Organes</text>
    </g>
    <g class="ill-legende" text-anchor="end">
      <rect class="ill-fond" x="279" y="78" width="78" height="28" rx="4" fill="#FFFFFF"/>
      <text x="354" y="89">Veines<tspan x="354" dy="13">pulmonaires</tspan></text>
    </g>
    <g class="ill-legende" text-anchor="end">
      <rect class="ill-fond" x="287" y="151" width="70" height="28" rx="4" fill="#FFFFFF"/>
      <text x="354" y="162">Oreillette<tspan x="354" dy="13">gauche</tspan></text>
    </g>
    <g class="ill-legende">
      <rect class="ill-fond" x="280" y="236" width="40" height="15" rx="4" fill="#FFFFFF"/>
      <text x="283" y="247">Aorte</text>
    </g>
    <g class="ill-legende" text-anchor="end">
      <rect class="ill-fond" x="285" y="297" width="72" height="15" rx="4" fill="#FFFFFF"/>
      <text x="354" y="308">Capillaires</text>
    </g>
    <g class="ill-legende">
      <rect class="ill-fond" x="113" y="242" width="66" height="28" rx="4" fill="#FFFFFF"/>
      <text x="116" y="253">Ventricule<tspan x="116" dy="13">droit</tspan></text>
    </g>
    <g class="ill-legende" text-anchor="end">
      <rect class="ill-fond" x="187" y="242" width="69" height="28" rx="4" fill="#FFFFFF"/>
      <text x="253" y="253">Ventricule<tspan x="253" dy="13">gauche</tspan></text>
    </g>
    <g class="ill-legende">
      <rect class="ill-fond" x="177" y="96" width="76" height="28" rx="4" fill="#FFFFFF"/>
      <text x="180" y="107">Circulation<tspan x="180" dy="13">pulmonaire</tspan></text>
    </g>
    <g class="ill-legende" text-anchor="middle">
      <rect class="ill-fond" x="118" y="272" width="128" height="15" rx="4" fill="#FFFFFF"/>
      <text x="182" y="283">Circulation générale</text>
    </g>
  </g>
</svg>
