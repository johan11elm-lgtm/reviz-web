<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 238" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- Échelle des temps géologiques : frise de 4,6 Ga à aujourd'hui, puis zoom sur les 540 derniers Ma (ères, crises, Homo sapiens). Réviz, 5e SVT, histoire de la Terre. -->
<rect x="20" y="40" width="320" height="18" fill="#EAE8F2" stroke="#2D2B57" stroke-width="1.75"/><rect x="302.4" y="40" width="37.6" height="18" fill="#FBE9DD" stroke="#B34400" stroke-width="2.25"/><path d="M20,35 V63" stroke="#2D2B57" stroke-width="1.5"/><text x="20" y="30" font-size="11" font-weight="600" fill="#8A8273">4,6 Ga</text><path d="M96.5,35 V63" stroke="#2D2B57" stroke-width="1.5"/><text x="96.5" y="30" font-size="11" font-weight="600" fill="#8A8273" text-anchor="middle">3,5 Ga</text><text x="340" y="30" font-size="11" font-weight="600" fill="#8A8273" text-anchor="end">540 Ma</text><path d="M302.4,60 L20,116 M340,60 L340,116" stroke="#B34400" stroke-width="1" stroke-dasharray="4 3" fill="none"/><rect x="20" y="118" width="170.7" height="22" fill="#F4EBDD" stroke="#2D2B57" stroke-width="1.75"/><rect x="190.7" y="118" width="110.2" height="22" fill="#F5E3DF" stroke="#2D2B57" stroke-width="1.75"/><rect x="300.9" y="118" width="39.1" height="22" fill="#DDF2E3" stroke="#2D2B57" stroke-width="1.75"/><path d="M321,169 L321,136" stroke="#2D2B57" stroke-width="1" opacity="0.6" fill="none"/><circle cx="321" cy="136" r="1.8" fill="#2D2B57"/><path d="M190.7,104 V144" stroke="#B34400" stroke-width="2.25"/><text x="190.7" y="100" font-size="11" font-weight="600" fill="#8A8273" text-anchor="middle">crise</text><path d="M300.9,104 V144" stroke="#B34400" stroke-width="2.25"/><text x="300.9" y="100" font-size="11" font-weight="600" fill="#8A8273" text-anchor="middle">crise</text><text x="20" y="156" font-size="11" font-weight="600" fill="#8A8273">540 Ma</text><text x="190.7" y="156" font-size="11" font-weight="600" fill="#8A8273" text-anchor="middle">252 Ma</text><text x="300.9" y="156" font-size="11" font-weight="600" fill="#8A8273" text-anchor="middle">66 Ma</text><text x="340" y="230" font-size="11" font-weight="600" fill="#8A8273" text-anchor="end">vers 300 000 ans</text><path d="M336,205 L339.5,142" stroke="#2D2B57" stroke-width="1" opacity="0.6" fill="none"/><circle cx="339.5" cy="142" r="1.8" fill="#2D2B57"/><g font-size="11.5" font-weight="600" fill="#2D2B57"><g class="ill-legende"><rect class="ill-fond" x="17" y="67" width="76.3" height="28" rx="4" fill="#FFFFFF"/><text x="20" y="78">Formation<tspan x="20" dy="13">de la Terre</tspan></text></g><g class="ill-legende"><rect class="ill-fond" x="90.5" y="67" width="88.9" height="28" rx="4" fill="#FFFFFF"/><text x="93.5" y="78">Premières<tspan x="93.5" dy="13">traces de vie</tspan></text></g><g class="ill-legende"><rect class="ill-fond" x="67.2" y="122" width="76.3" height="15" rx="4" fill="#F4EBDD"/><text x="105.3" y="133" text-anchor="middle">Paléozoïque</text></g><g class="ill-legende"><rect class="ill-fond" x="210.8" y="122" width="70" height="15" rx="4" fill="#F5E3DF"/><text x="245.8" y="133" text-anchor="middle">Mésozoïque</text></g><g class="ill-legende"><rect class="ill-fond" x="257" y="169" width="70" height="15" rx="4" fill="#FFFFFF"/><text x="324" y="180" text-anchor="end">Cénozoïque</text></g><g class="ill-legende"><rect class="ill-fond" x="260.4" y="205" width="82.6" height="15" rx="4" fill="#FFFFFF"/><text x="340" y="216" text-anchor="end">Homo sapiens</text></g></g>
</svg>
