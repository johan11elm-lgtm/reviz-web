<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- Cœur en coupe, vu de face (le cœur droit est à gauche du dessin). Réviz, 5e SVT, circulation sanguine. -->
  <g transform="translate(20 8) scale(0.8)">
    <!-- Muscle cardiaque -->
    <path d="M120,108 Q120,90 138,90 L262,90 Q280,90 280,108 L280,205 Q280,250 200,300 Q120,250 120,205 Z" fill="#F5E3DF" stroke="#2D2B57" stroke-width="2.5"/>

    <!-- Vaisseaux : contour encre puis couleur du sang -->
    <g fill="none" stroke-linejoin="round">
      <g stroke="#2D2B57" stroke-width="14">
        <path d="M150,30 V110"/>
        <path d="M92,134 H140"/>
        <path d="M184,170 V20"/>
        <path d="M214,176 V58 Q214,40 232,40 H296 Q314,40 314,58 V86"/>
        <path d="M372,118 H250"/>
      </g>
      <g stroke-width="10">
        <path d="M150,30 V110" stroke="#3461C9"/>
        <path d="M92,134 H140" stroke="#3461C9"/>
        <path d="M184,170 V20" stroke="#3461C9"/>
        <path d="M214,176 V58 Q214,40 232,40 H296 Q314,40 314,58 V86" stroke="#C8364F"/>
        <path d="M372,118 H250" stroke="#C8364F"/>
      </g>
    </g>

    <!-- Les quatre cavités -->
    <g stroke-width="2.5">
      <rect x="132" y="102" width="43" height="46" rx="12" fill="#DCE6FA" stroke="#3461C9"/>
      <path d="M144,162 H192 V236 Q182,258 164,258 Q146,252 134,214 V174 Q134,162 144,162 Z" fill="#DCE6FA" stroke="#3461C9"/>
      <rect x="222" y="102" width="46" height="46" rx="12" fill="#F9DCE1" stroke="#C8364F"/>
      <path d="M205,168 H252 Q262,168 262,178 V212 Q252,245 236,250 Q217,250 205,232 Z" fill="#F9DCE1" stroke="#C8364F"/>
    </g>

    <!-- Valvules entre oreillettes et ventricules -->
    <path d="M140,150 L152,161 M168,150 L157,161 M230,152 L242,166 M260,152 L248,166" fill="none" stroke="#2D2B57" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Trajet du sang dans le cœur : oreillette → ventricule → artère -->
    <g fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M154,112 V190 Q154,238 170,234 Q184,230 184,180 M178,188 L184,180 L190,188" stroke="#1F3F8F"/>
      <path d="M245,112 V188 Q245,236 229,232 Q214,228 214,184 M208,192 L214,184 L220,192" stroke="#8E1F33"/>
    </g>

    <!-- Sens du sang dans les vaisseaux -->
    <path d="M145,56 L150,62 L155,56 M106,129 L112,134 L106,139 M179,64 L184,58 L189,64 M309,68 L314,74 L319,68 M334,113 L328,118 L334,123" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Côtés, par rapport à la personne -->
  <g font-size="9.5" font-weight="700" letter-spacing="1" fill="#6E675B" text-anchor="middle">
    <text x="6" y="244" text-anchor="start">CŒUR DROIT</text>
    <text x="354" y="244" text-anchor="end">CŒUR GAUCHE</text>
  </g>

  <!-- Traits de rappel -->
  <g stroke="#2D2B57" stroke-width="1" opacity="0.6" fill="none">
    <path d="M76,36 L134,40"/>
    <path d="M70,80 L129,99"/>
    <path d="M76,116 L93,115"/>
    <path d="M54,147 L137,132"/>
    <path d="M70,194 L140,180"/>
    <path d="M286,160 L228,118"/>
    <path d="M286,198 L222,184"/>
    <path d="M180,282 L180.8,198"/>
  </g>
  <g fill="#2D2B57">
    <circle cx="134" cy="40" r="1.8"/>
    <circle cx="129" cy="99" r="1.8"/>
    <circle cx="137" cy="132" r="1.8"/>
    <circle cx="140" cy="180" r="1.8"/>
    <circle cx="228" cy="118" r="1.8"/>
    <circle cx="222" cy="184" r="1.8"/>
    <circle cx="180.8" cy="198" r="1.8"/>
  </g>

  <!-- Légendes : un groupe par étiquette (masquables en mode « Me tester ») -->
  <g font-size="11.5" font-weight="600" fill="#2D2B57">
    <g class="ill-legende">
      <rect class="ill-fond" x="114" y="3" width="110" height="15" rx="4" fill="#FFFFFF"/>
      <text x="169" y="14" text-anchor="middle">Artère pulmonaire</text>
    </g>
    <g class="ill-legende">
      <rect class="ill-fond" x="3" y="20" width="72" height="28" rx="4" fill="#FFFFFF"/>
      <text x="6" y="31">Veine cave<tspan x="6" dy="13">supérieure</tspan></text>
    </g>
    <g class="ill-legende">
      <rect class="ill-fond" x="3" y="66" width="66" height="28" rx="4" fill="#FFFFFF"/>
      <text x="6" y="77">Oreillette<tspan x="6" dy="13">droite</tspan></text>
    </g>
    <g class="ill-legende">
      <rect class="ill-fond" x="3" y="102" width="72" height="28" rx="4" fill="#FFFFFF"/>
      <text x="6" y="113">Veine cave<tspan x="6" dy="13">inférieure</tspan></text>
    </g>
    <g class="ill-legende">
      <rect class="ill-fond" x="3" y="140" width="50" height="15" rx="4" fill="#FFFFFF"/>
      <text x="6" y="151">Valvule</text>
    </g>
    <g class="ill-legende">
      <rect class="ill-fond" x="3" y="180" width="66" height="28" rx="4" fill="#FFFFFF"/>
      <text x="6" y="191">Ventricule<tspan x="6" dy="13">droit</tspan></text>
    </g>
    <g class="ill-legende">
      <rect class="ill-fond" x="280" y="56" width="40" height="15" rx="4" fill="#FFFFFF"/>
      <text x="283" y="67">Aorte</text>
    </g>
    <g class="ill-legende" text-anchor="end">
      <rect class="ill-fond" x="279" y="112" width="78" height="28" rx="4" fill="#FFFFFF"/>
      <text x="354" y="123">Veines<tspan x="354" dy="13">pulmonaires</tspan></text>
    </g>
    <g class="ill-legende" text-anchor="end">
      <rect class="ill-fond" x="287" y="148" width="70" height="28" rx="4" fill="#FFFFFF"/>
      <text x="354" y="159">Oreillette<tspan x="354" dy="13">gauche</tspan></text>
    </g>
    <g class="ill-legende" text-anchor="end">
      <rect class="ill-fond" x="287" y="186" width="70" height="28" rx="4" fill="#FFFFFF"/>
      <text x="354" y="197">Ventricule<tspan x="354" dy="13">gauche</tspan></text>
    </g>
    <g class="ill-legende" text-anchor="middle">
      <rect class="ill-fond" x="153" y="282" width="54" height="15" rx="4" fill="#FFFFFF"/>
      <text x="180" y="293">Cloison</text>
    </g>
  </g>
</svg>
