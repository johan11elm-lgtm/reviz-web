<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<!-- Plan de quartier fictif : départ « You are here », first / second street on the left, carrefour, lieux de la ville ; l'itinéraire « Go straight on, then take the first street on the left. It's on your right, opposite the bank » mène au musée. Réviz, 6e anglais, Londres : l'impératif et les directions. -->
<rect x="12" y="12" width="336" height="276" fill="#FFFFFF" stroke="#C9C4B8" stroke-width="0.75"/>
<!-- Îlots (pâtés de maisons) -->
<g fill="#F1EEE8" stroke="#CFC8BA" stroke-width="1">
<rect x="96" y="14" width="178" height="26" rx="3"/>
<rect x="14" y="46" width="153" height="42" rx="3"/>
<rect x="14" y="122" width="153" height="52" rx="3"/>
<rect x="14" y="208" width="153" height="78" rx="3"/>
<rect x="203" y="208" width="143" height="78" rx="3"/>
</g>
<!-- Parc -->
<rect x="203" y="46" width="143" height="128" rx="3" fill="#DDF2E3" stroke="#2E8B57" stroke-width="1"/>
<g fill="#2E8B57" opacity="0.55">
<circle cx="226" cy="70" r="7"/><circle cx="322" cy="66" r="7"/><circle cx="234" cy="152" r="7"/><circle cx="318" cy="150" r="7"/>
</g>
<!-- Bâtiments -->
<g stroke="#2D2B57" stroke-width="1.75">
<rect x="128" y="17" width="114" height="20" rx="2" fill="#FFFFFF"/>
<rect x="52" y="52" width="104" height="30" rx="2" fill="#FFFFFF"/>
<rect x="80" y="128" width="80" height="40" rx="2" fill="#FBE9DD" stroke="#B34400" stroke-width="2.25"/>
<rect x="80" y="214" width="80" height="34" rx="2" fill="#FFFFFF"/>
<rect x="250" y="214" width="88" height="40" rx="2" fill="#FFFFFF"/>
</g>
<!-- Croix de l'église -->
<path d="M326,220v12M321,224h10" stroke="#2D2B57" stroke-width="1.75"/>
<!-- Arrêt de bus : poteau et panneau -->
<path d="M209,276v-22" stroke="#2D2B57" stroke-width="1.75"/>
<rect x="204" y="246" width="10" height="8" rx="1.5" fill="#2D2B57"/>
<!-- Noms des rues (mentions secondaires) -->
<g font-size="11" font-weight="600" fill="#8A8273">
<text x="18" y="109">second street on the left</text>
<text x="18" y="200">first street on the left</text>
</g>
<!-- Itinéraire -->
<path d="M185,268V184H96" fill="none" stroke="#B34400" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M88,184L96,179.5L96,188.5Z" fill="#B34400"/>
<circle cx="185" cy="274" r="5" fill="#B34400" stroke="#FFFFFF" stroke-width="1.5"/>
<g font-size="11.5" font-weight="600" fill="#2D2B57">
<text x="176" y="278" text-anchor="end">You are here</text>
<g class="ill-legende"><rect class="ill-fond" x="157" y="18" width="56" height="18" rx="4" fill="#FFFFFF"/><text x="185" y="31" text-anchor="middle">station</text></g>
<g class="ill-legende"><rect class="ill-fond" x="78" y="58" width="52" height="18" rx="4" fill="#FFFFFF"/><text x="104" y="71" text-anchor="middle">library</text></g>
<g class="ill-legende"><rect class="ill-fond" x="91" y="139" width="58" height="18" rx="4" fill="#FBE9DD"/><text x="120" y="152" text-anchor="middle">museum</text></g>
<g class="ill-legende"><rect class="ill-fond" x="99" y="222" width="42" height="18" rx="4" fill="#FFFFFF"/><text x="120" y="235" text-anchor="middle">bank</text></g>
<g class="ill-legende"><rect class="ill-fond" x="252" y="225" width="54" height="18" rx="4" fill="#FFFFFF"/><text x="279" y="238" text-anchor="middle">church</text></g>
<g class="ill-legende"><rect class="ill-fond" x="252" y="102" width="44" height="18" rx="4" fill="#DDF2E3"/><text x="274" y="115" text-anchor="middle">park</text></g>
<g class="ill-legende"><rect class="ill-fond" x="218" y="263" width="62" height="18" rx="4" fill="#F1EEE8"/><text x="222" y="276">bus stop</text></g>
</g>
</svg>
