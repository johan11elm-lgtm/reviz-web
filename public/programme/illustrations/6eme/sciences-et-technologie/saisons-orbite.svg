43 L304,98" stroke="#2D2B57" stroke-width="1" opacity="0.6" fill="none"/><circle cx="304" cy="98" r="1.8" fill="#2D2B57"/><path d="M30,181 L36.5,143.2" stroke="#2D2B57" stroke-width="1" opacity="0.6" fill="none"/><circle cx="36.5" cy="143.2" r="1.8" fill="#2D2B57"/><g font-size="11.5" font-weight="600" fill="#2D2B57"><g class="ill-legende"><rect class="ill-fond" x="3" y="15" width="114.1" height="28" rx="4" fill="#FFFFFF"/><text x="6" y="26">Été dans<tspan x="6" dy="13">l'hémisphère Nord</tspan></text></g><g class="ill-legende"><rect class="ill-fond" x="242.9" y="15" width="114.1" height="28" rx="4" fill="#FFFFFF"/><text x="354" y="26" text-anchor="end">Hiver dans<tspan x="354" dy="13">l'hémisphère Nord</tspan></text></g><g class="ill-legende"><rect class="ill-fond" x="3" y="181" width="101.5" height="15" rx="4" fill="#FFFFFF"/><text x="6" y="192">Axe de rotation</text></g></g>
