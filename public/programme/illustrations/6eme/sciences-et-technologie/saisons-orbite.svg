<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 204" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- Orbite de la Terre autour du Soleil, axe incliné de 23° toujours dans la même direction : en juin l'hémisphère Nord est tourné vers le Soleil, en décembre à l'opposé. Sans échelle. Réviz, 6e sciences, la Terre dans le système solaire. -->
