<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 226" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- Groupes emboîtés : squelette interne, quatre membres, poils ; truite, grenouille, chat, chauve-souris ; le criquet hors des boîtes. Réviz, 6e sciences, classer les êtres vivants. -->
<rect x="12" y="12" width="260" height="202" rx="10" fill="#F6F5FA" stroke="#2D2B57" stroke-width="1.75"/><rect x="80" y="50" width="184" height="156" rx="10" fill="#ECEAF4" stroke="#2D2B57" stroke-width="1.75"/><rect x="156" y="88" width="102" height="110" rx="10" fill="#FBE9DD" stroke="#B34400" stroke-width="2.25"/><g font-size="11.5" font-weight="600" fill="#2D2B57" text-anchor="middle"><text x="46" y="186">Truite</text><text x="116" y="186">Grenouille</text><text x="207" y="158">Chat</text><text x="207" y="182">Chauve-souris</text><text x="314" y="110">Criquet</text></g><text x="314" y="126" font-size="11" font-weight="600" fill="#8A8273" text-anchor="middle">six pattes</text><text x="314" y="139" font-size="11" font-weight="600" fill="#8A8273" text-anchor="middle">articulées</text><g font-size="11.5" font-weight="600" fill="#2D2B57"><g class="ill-legende"><rect class="ill-fond" x="18" y="19" width="114.1" height="15" rx="4" fill="#F6F5FA"/><text x="21" y="30">Squelette interne</text></g><g class="ill-legende"><rect class="ill-fond" x="86" y="57" width="95.2" height="15" rx="4" fill="#ECEAF4"/><text x="89" y="68">Quatre membres</text></g><g class="ill-legende"><rect class="ill-fond" x="162" y="95" width="38.5" height="15" rx="4" fill="#FBE9DD"/><text x="165" y="106">Poils</text></g></g>
</svg>
